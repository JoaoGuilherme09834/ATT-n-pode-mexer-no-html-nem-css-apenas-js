
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo HTML, CSS e DOM</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: lightblue;
            padding: 20px;
        }

        nav {
            background-color: lightgray;
            padding: 15px;
        }

        main {
            background-color: white;
            padding: 20px;
            min-height: 200px;
        }

        footer {
            background-color: gray;
            padding: 20px;
        }

        .bloco-footer {
            padding: 15px;
            margin: 10px;
        }

        #bloco1 {
            background-color: lightcoral;
        }

        #bloco2 {
            background-color: lightgreen;
        }

        #bloco3 {
            background-color: lightyellow;
        }
    </style>
</head>

<body>

    <header>
        <h1>Meu Site</h1>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
    </nav>

    <main id="conteudo">
        <!-- O JavaScript criará os elementos aqui -->
    </main>


    <script>
        

// Selecionar o elemento main
const main = document.getElementById("conteudo");

// MODIFICAR O CSS PELO JAVASCRIPT
document.body.style.backgroundColor = "#f5f0e8";
document.body.style.fontFamily = "Arial, sans-serif";
document.body.style.textAlign = "center";

main.style.backgroundColor = "#fffaf5";
main.style.padding = "30px";
main.style.textAlign = "center";

// Personalizar o header
document.querySelector("header").style.backgroundColor = "#bc002d";
document.querySelector("header").style.color = "white";

// Personalizar o menu
document.querySelector("nav").style.backgroundColor = "#f0d9d9";



// Centralizar os blocos do footer
const blocos = document.querySelectorAll(".bloco-footer");

blocos.forEach(bloco => {
    bloco.style.display = "inline-block";
    bloco.style.padding = "15px";
    bloco.style.borderRadius = "10px";
});

// CRIAR UM TÍTULO
const titulo = document.createElement("h1");
titulo.textContent = "Japão: A Terra do Sol Nascente";
titulo.style.color = "#bc002d";
titulo.style.fontSize = "32px";
main.appendChild(titulo);

// CRIAR UM SUBTÍTULO
const subtitulo = document.createElement("h2");
subtitulo.textContent = "Minha experiência na Feira das Nações";
subtitulo.style.color = "#333";
main.appendChild(subtitulo);

// CRIAR PARÁGRAFO COM OPINIÃO
const paragrafo = document.createElement("p");

paragrafo.textContent = "Eu achei a Feira das Nações uma experiência muito interessante e divertida. Foi uma oportunidade de conhecer um pouco mais sobre a cultura de outros países, suas tradições, comidas e costumes. O espaço do Japão chamou minha atenção pela sua cultura tão diferente e interessante.";

main.appendChild(paragrafo);

// CRIAR OUTRO PARÁGRAFO COM OPINIÃO
const paragrafo2 = document.createElement("p");

paragrafo2.textContent = "Gostei bastante de conhecer mais sobre o Japão e ver como seus elementos culturais foram apresentados na feira. Achei interessante a dedicação na organização e na decoração do espaço, pois tornou a experiência mais interativa e ajudou a entender melhor a cultura japonesa.";

main.appendChild(paragrafo2);

// CRIAR UMA IMAGEM
const imagem = document.createElement("img");

imagem.src = "https://st3.depositphotos.com/1035350/18412/i/450/depositphotos_184121238-stock-photo-fujiyoshida-japan-spring-landscape.jpg";
imagem.alt = "Paisagem tradicional japonesa";

imagem.style.width = "80%";
imagem.style.maxWidth = "500px";
imagem.style.borderRadius = "15px";
imagem.style.margin = "20px auto";
imagem.style.display = "block";

main.appendChild(imagem);

// CRIAR SUBTÍTULO DA LISTA
const tituloLista = document.createElement("h2");

tituloLista.textContent = "Elementos apresentados na Feira das Nações";
tituloLista.style.color = "#bc002d";

main.appendChild(tituloLista);

// CRIAR UMA LISTA ORDENADA
const lista = document.createElement("ol");

lista.style.display = "inline-block";
lista.style.textAlign = "left";
lista.style.lineHeight = "2";
lista.style.fontSize = "17px";

// Itens da lista
const elementos = [
    "Bandeira do Japão, representando o país.",
    "Comidas típicas da culinária japonesa, como sushi.",
    "Decoração inspirada na cultura japonesa.",
    "Informações sobre os costumes e tradições do Japão.",
    "Representações da cultura japonesa, como animes e mangás.",
    "Imagens e referências a pontos turísticos japoneses."
];

// Criar os itens automaticamente
elementos.forEach(elemento => {
    const item = document.createElement("li");
    item.textContent = elemento;
    lista.appendChild(item);
});

// Adicionar lista ao main
main.appendChild(lista);

// CRIAR PARÁGRAFO FINAL
const final = document.createElement("p");

final.textContent = "No geral, gostei muito de participar da Feira das Nações. Foi uma experiência que contribuiu para meu aprendizado e mostrou como podemos conhecer diferentes culturas sem precisar sair do nosso país.";

final.style.marginTop = "25px";
final.style.fontWeight = "bold";
final.style.color = "#bc002d";

main.appendChild(final);

    </script>

</body>
</html>
